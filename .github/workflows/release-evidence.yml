name: Release Evidence Without Deployment
on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'api/**', 'web/**', 'tests/**', '.github/workflows/release-evidence.yml', '.github/workflows/shadow-scan.yml']
permissions:
  contents: read
concurrency:
  group: release-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check deployment lock and exact candidate
        run: |
          python -c "import json; assert json.load(open('vercel.json'))['git']['deploymentEnabled'] is False"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Checkout pinned public AI Visibility contract
        uses: actions/checkout@v4
        with:
          repository: mehmetozan-5858/ai-visibility
          ref: dcbba5f2e158e2bfa4e1d02e5045c46068fe4d3f
          path: .peer-visibility
          persist-credentials: false
      - name: Install isolated browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/broker-browser" --no-save --package-lock=false playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/broker-browser/node_modules" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          test -x "$(command -v google-chrome)"
      - name: Exercise local UI, negative cases and pinned peer contract
        env:
          AI_VISIBILITY_ROOT: ${{ github.workspace }}/.peer-visibility
        run: node tests/release-evidence-smoke.cjs
  source-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned document reader
        run: python -m pip install --disable-pip-version-check pypdf==6.1.1
      - name: Read one real notice-linked sample without approval or external writes
        run: python -m src.ted_annex_probe
