name: Bounded Annex Review Audit
on:
  pull_request:
    branches: [main]
    paths: ['src/annex_review_audit.py', 'tests/test_annex_review_audit.py', '.github/workflows/annex-review-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded offline readers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends antiword
          python -m pip install --disable-pip-version-check pypdf==6.1.1 openpyxl==3.1.5 defusedxml==0.7.1
      - name: Reject malformed inputs before reading the sample
        run: python -m unittest discover -s tests -p 'test_annex_review_audit.py' -v
      - name: Read only the observed remaining sample files without approving them
        run: python -m src.annex_review_audit
