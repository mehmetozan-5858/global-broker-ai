name: Deploy Global Broker Mobile

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare mobile site
        run: |
          mkdir -p public/data
          cp -r web/* public/
          if [ -f web/index.html ]; then
            cp web/index.html public/customer.html
            sed -i 's#</body>#<script src="pricing-policy.js" defer></script><script src="contact-unlock-bridge.js" defer></script><script src="customer-portal.js" defer></script><script src="customer-priority.js" defer></script></body>#' public/customer.html
          fi
          if [ -f web/app.html ]; then
            cp web/app.html public/dashboard.html
            sed -i 's#</body>#<script src="ceo-dashboard.js" defer></script></body>#' public/dashboard.html
            sed -i 's#</body>#<script src="tender-dossier.js" defer></script></body>#' public/dashboard.html
          fi
          if [ -f web/website.html ]; then
            cp web/website.html public/index.html
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path('data/latest-opportunities.json')
          out=Path('public/data/latest-opportunities.json')
          blocked_exact={
              'email','e-mail','phone','telephone','mobile','contact','contact_email','contact_phone','buyer_email','buyer_phone','supplier_email','supplier_phone',
              'website','linkedin','address','street','postal_code','contact_person','representative','buyer-name','buyer_name','borrower','agency','department','office',
              'contracting_authority','organization_name','source_url','source-url','url','notice_url','detail_url','document_url'
          }
          def scrub(row):
              clean={}
              for k,v in row.items():
                  lk=str(k).lower()
                  if lk in blocked_exact or any(x in lk for x in ('email','phone','telephone','mobile','linkedin','contact_person','address')):
                      continue
                  clean[k]=v
              clean['buyer_masked']=True
              clean['buyer_display']='Doğrulanmış alıcı — giriş yaparak erişim kurallarını inceleyin'
              return clean
          if src.exists():
              data=json.loads(src.read_text(encoding='utf-8'))
              rows=[]
              for row in data.get('opportunities') or []:
                  if isinstance(row,dict) and (row.get('export_goods_review') or {}).get('status')=='goods_candidate':
                      rows.append(scrub(row))
                  if len(rows)>=100:
                      break
              out.write_text(json.dumps({'mode':'public_preview_masked','opportunities':rows},ensure_ascii=False),encoding='utf-8')
          else:
              out.write_text('{"mode":"public_preview_masked","opportunities":[]}',encoding='utf-8')
          PY
          sed -i 's#../data/latest-opportunities.json#data/latest-opportunities.json#g' public/dashboard.html || true
          sed -i 's#../data/latest-opportunities.json#data/latest-opportunities.json#g' public/customer.html || true
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
      - name: Live customer acceptance smoke test
        run: |
          set -euo pipefail
          BASE="https://mehmetozan-5858.github.io/global-broker-ai"
          fetch_page() {
            local path="$1" out="$2"
            for attempt in 1 2 3 4 5 6; do
              if curl -fsSL --max-time 20 "$BASE/$path" -o "$out"; then
                return 0
              fi
              sleep 5
            done
            echo "unable to fetch deployed page: $path" >&2
            return 1
          }
          fetch_page "" /tmp/home.html
          fetch_page "customer.html" /tmp/customer.html
          fetch_page "account.html" /tmp/account.html
          fetch_page "privacy.html" /tmp/privacy.html
          fetch_page "terms.html" /tmp/terms.html
          fetch_page "data/latest-opportunities.json" /tmp/opportunities.json
          fetch_page "contact-unlock-bridge.js" /tmp/contact-unlock-bridge.js

          grep -q "GLOBAL" /tmp/home.html
          grep -q "Fırsat" /tmp/customer.html
          grep -q "contact-unlock-bridge.js" /tmp/customer.html
          grep -q "broker-contact-unlock" /tmp/contact-unlock-bridge.js
          grep -q "/auth/v1/token?grant_type=password" /tmp/account.html
          grep -q "Gizlilik" /tmp/privacy.html
          grep -q "Kullanım koşulları" /tmp/terms.html
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/opportunities.json').read_text(encoding='utf-8'))
          if data.get('mode')!='public_preview_masked':
              raise SystemExit('public feed is not masked preview mode')
          rows=data.get('opportunities') or []
          for row in rows:
              if (row.get('export_goods_review') or {}).get('status')!='goods_candidate':
                  raise SystemExit('public customer feed contains a non-goods record')
              text=' '.join(map(str,row.keys())).lower()
              if 'buyer_name' in text or 'buyer-name' in text or 'email' in text or 'phone' in text or 'source_url' in text:
                  raise SystemExit('masked preview contains private fields')
          print(f'CUSTOMER_ACCEPTANCE_OK masked_opportunities={len(rows)}')
          PY
