name: Deploy Global Broker Mobile

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare mobile site
        run: |
          mkdir -p public/data
          cp -r web/* public/
          if [ -f web/index.html ]; then
            cp web/index.html public/customer.html
            # W2 customer search and quality quick-views are separate progressive-enhancement scripts.
            sed -i 's#</body>#<script src="customer-portal.js" defer></script><script src="customer-priority.js" defer></script></body>#' public/customer.html
          fi
          if [ -f web/app.html ]; then
            cp web/app.html public/dashboard.html
            # Preserve the existing dashboard and its public-data-only scripts at a stable URL.
            sed -i 's#</body>#<script src="ceo-dashboard.js" defer></script></body>#' public/dashboard.html
            sed -i 's#</body>#<script src="tender-dossier.js" defer></script></body>#' public/dashboard.html
          fi
          if [ -f web/website.html ]; then
            cp web/website.html public/index.html
          fi
          if [ -f data/latest-opportunities.json ]; then
            cp data/latest-opportunities.json public/data/latest-opportunities.json
          else
            echo '{"mode":"shadow","opportunities":[]}' > public/data/latest-opportunities.json
          fi
          sed -i 's#../data/latest-opportunities.json#data/latest-opportunities.json#g' public/dashboard.html || true
          sed -i 's#../data/latest-opportunities.json#data/latest-opportunities.json#g' public/customer.html || true
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
