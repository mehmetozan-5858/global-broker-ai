name: Verified Brokerage CI

on:
  push:
    branches:
      - feat/verified-brokerage-pipeline
      - feat/broker-ceo-sales-current-main
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'web/**'
      - '.github/workflows/verified-brokerage-ci.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'web/**'
      - '.github/workflows/verified-brokerage-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run brokerage test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check mobile dashboard JavaScript syntax
        run: |
          node --check web/ceo-dashboard.js
          node --check web/tender-dossier.js
          node --check web/country-markets.js
          node --check web/customer-portal.js
          node --check web/customer-priority.js
          node --check web/customer-brand-bridge.js
          node --check web/operational-panels.js
          node --check web/opportunity-readiness.js
          node --check web/opportunity-dossier.js
          node --check web/ceo-priority.js
          node --check web/today-tasks.js
          node --check web/task-center.js
          node --check web/system-health.js
