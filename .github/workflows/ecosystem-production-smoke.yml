name: Ecosystem Production Smoke
on:
  push:
    branches: [main]
    paths: ['web/**', 'src/**', 'pyproject.toml', 'vercel.json', 'tests/ecosystem-production-smoke.cjs', 'tests/supplier-capability-smoke.cjs', 'tests/progress-smoke.cjs', 'tests/account-recovery-smoke.cjs', 'tests/contact-smoke.cjs', 'tests/evidence-readiness-smoke.cjs', 'tests/quote-evidence-smoke.cjs', 'tests/auth-return-smoke.cjs', 'tests/membership-smoke.cjs', 'tests/customer-dossier-smoke.cjs', 'tests/rfq-draft-smoke.cjs', 'api/**', 'sql/**', 'render_server.py', '.github/workflows/ecosystem-production-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecosystem-production-smoke
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install read-only browser test runner
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium webkit
      - name: Wait for reviewed handoff deployment
        run: |
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 15 https://global-broker-opal.vercel.app/web/ecosystem.js | grep -q transferFields && curl -fsS --max-time 15 "https://global-broker-opal.vercel.app/?ecosystemQA=$GITHUB_RUN_ID" | grep -q menuBtn; then
              exit 0
            fi
            sleep 10
          done
          echo 'Production handoff asset is not reachable; acceptance remains incomplete.' >&2
          exit 1
      - name: Wait for matching ecosystem contract
        run: |
          deployed_contract=$(mktemp)
          trap 'rm -f "$deployed_contract"' EXIT
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 15 "https://broker.aivisibilityworks.com/web/ecosystem-contract.js?deploymentQA=$GITHUB_RUN_ID" -o "$deployed_contract" && cmp -s web/ecosystem-contract.js "$deployed_contract"; then
              exit 0
            fi
            sleep 10
          done
          echo 'Production ecosystem contract differs from the tested revision.' >&2
          exit 1
      - name: Wait for matching sandbox membership UI
        run: |
          deployed_sandbox=$(mktemp)
          trap 'rm -f "$deployed_sandbox"' EXIT
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 15 "https://broker.aivisibilityworks.com/web/membership-sandbox.js?deploymentQA=$GITHUB_RUN_ID" -o "$deployed_sandbox" && cmp -s web/membership-sandbox.js "$deployed_sandbox"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Wait for matching quote UI deployment
        run: |
          deployed_quote=$(mktemp)
          trap 'rm -f "$deployed_quote"' EXIT
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 15 "https://broker.aivisibilityworks.com/web/quote-evidence.js?deploymentQA=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -o "$deployed_quote" && cmp -s web/quote-evidence.js "$deployed_quote"; then
              exit 0
            fi
            sleep 10
          done
          echo 'Production quote UI differs from the tested revision; browser verification cannot start.' >&2
          exit 1
      - name: Verify web and app ecosystem without external writes
        run: |
          node tests/ecosystem-production-smoke.cjs
          node tests/supplier-capability-smoke.cjs
          node tests/progress-smoke.cjs
          node tests/account-recovery-smoke.cjs
          node tests/contact-smoke.cjs
          node tests/quote-evidence-smoke.cjs
          node tests/auth-return-smoke.cjs
          node tests/membership-smoke.cjs
          node tests/billing-sandbox-smoke.cjs
          node tests/customer-dossier-smoke.cjs
          node tests/rfq-draft-smoke.cjs

      - name: Wait for evidence readiness asset and verify production UI
        run: |
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 15 https://broker.aivisibilityworks.com/web/evidence-readiness.js | grep -q GBEvidenceReadiness; then
              GB_READINESS_BASE=https://broker.aivisibilityworks.com node tests/evidence-readiness-smoke.cjs
              exit 0
            fi
            sleep 10
          done
          exit 1
