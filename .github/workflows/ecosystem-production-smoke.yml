name: Ecosystem Production Smoke
on:
  push:
    branches: [main]
    paths: ['web/**', 'src/**', 'tests/ecosystem-production-smoke.cjs', '.github/workflows/ecosystem-production-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecosystem-production-smoke
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install read-only browser test runner
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Wait for reviewed handoff deployment
        run: |
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 15 https://global-broker-ai-visibility2.vercel.app/web/ecosystem.js | grep -q transferFields; then
              exit 0
            fi
            sleep 10
          done
          echo 'Production handoff asset is not reachable; acceptance remains incomplete.' >&2
          exit 1
      - name: Verify web and app ecosystem without external writes
        run: node tests/ecosystem-production-smoke.cjs
