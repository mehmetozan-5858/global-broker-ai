name: Global Broker Shadow Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/shadow-scan.yml'
      - '.github/workflows/shadow-scan-trigger.txt'

concurrency:
  group: global-broker-shadow-scan
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  shadow-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install document reader
        run: python -m pip install --disable-pip-version-check pypdf==6.1.1
      - name: Run brokerage regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Fetch, enrich, read source pages and documents, analyze specifications and verify live global opportunities
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p data
          NEXT=data/latest-opportunities.next.json
          rm -f "$NEXT"
          scan_step() {
            local label="$1" seconds="$2"
            shift 2
            echo "::group::SCAN_STEP_START $label $(date -u +%FT%TZ) limit=${seconds}s" >&2
            local started=$SECONDS
            if timeout --signal=TERM --kill-after=15s "${seconds}s" "$@"; then
              echo "SCAN_STEP_OK $label duration=$((SECONDS-started))s" >&2
            else
              local status=$?
              echo "::error::SCAN_STEP_FAILED $label status=$status duration=$((SECONDS-started))s" >&2
              exit "$status"
            fi
            echo "::endgroup::" >&2
          }
          # Core collection is kept deterministic; presentation translation happens outside this bounded stage.
          scan_step broker 180 python -c 'import src.broker as b; b.auto_translate_tr=lambda text:""; b.main()' > "$NEXT"
          test -s "$NEXT"
          scan_step china_feed 300 python -m src.china_feed "$NEXT"
          scan_step china_ggzy_feed 300 python -m src.china_ggzy_feed "$NEXT"
          # A4 first live Gulf adapter: Qatar's official Monaqasat public tender listing.
          scan_step qatar_monaqasat 90 python -m src.qatar_monaqasat_feed "$NEXT"
          # A2: only physical goods can enter the commercial research pipeline.
          scan_step physical_goods_gate 30 python -m src.physical_goods_gate "$NEXT"
          # A3 first pass: label immediately available source fields before research.
          scan_step field_evidence_initial 30 python -m src.field_evidence "$NEXT"
          scan_step china_import_radar 240 python -m src.china_import_radar "$NEXT" data/latest-opportunities.json
          scan_step enrichment 90 python -m src.enrichment "$NEXT"
          scan_step document_parser 480 python -m src.document_parser "$NEXT" data/latest-opportunities.json
          scan_step ted_xml_enricher 480 python -m src.ted_xml_enricher "$NEXT"
          scan_step specification 90 python -m src.specification "$NEXT"
          # A3 final pass: source documents/XML may have added direct fields after the initial pass.
          # Recompute coverage only from explicit source-backed fields; missing values stay missing.
          scan_step field_evidence_final 30 python -m src.field_evidence "$NEXT"
          scan_step verification 180 python -m src.verification "$NEXT"
          scan_step sales_priority 90 python -m src.sales_priority "$NEXT"
          # A4-A10: official Gulf registry truthfulness, commercial terms, supplier queue,
          # feasibility, offer/risk gate, agent center and fail-closed launch readiness.
          scan_step remaining_pipeline 30 python -m src.remaining_pipeline "$NEXT"
      - name: Validate enriched live output
        run: |
          set -euo pipefail
          NEXT=data/latest-opportunities.next.json
          python -m src.validate_live_output "$NEXT"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/latest-opportunities.next.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          opportunities=data.get('opportunities') or []
          radar=((data.get('china_import_radar') or {}).get('items') or [])
          if not opportunities and not radar:
              raise SystemExit('refusing to replace live data: all live opportunity and China-demand feeds are empty')
          if any((o.get('export_goods_review') or {}).get('status') != 'goods_candidate' for o in opportunities):
              raise SystemExit('physical-goods gate violation: non-goods record reached live opportunities')
          if opportunities and not data.get('field_evidence_summary'):
              raise SystemExit('A3 field evidence missing from live payload')
          if any(not isinstance(o.get('field_evidence'), dict) for o in opportunities):
              raise SystemExit('A3 field evidence missing from one or more live opportunities')
          for required in ('gulf_sources','commercial_terms_summary','supplier_research_summary','commercial_feasibility_summary','offer_risk_summary','agent_center','launch_gate'):
              if required not in data:
                  raise SystemExit(f'remaining roadmap stage missing: {required}')
          if (data.get('launch_gate') or {}).get('launch_ready'):
              raise SystemExit('unexpected production launch: Shadow Scan must not open production without explicit external production gates')
          print(f'ATOMIC_FEED_GATE opportunities={len(opportunities)} china_import_radar={len(radar)} launch_ready=false')
          PY
          mv "$NEXT" data/latest-opportunities.json
      # Internal CEO analysis is deliberately NOT committed or deployed publicly.
      - name: Generate ephemeral internal CEO review
        run: python -m src.build_ceo_report data/latest-opportunities.json data/latest-ceo-report.json
      - name: Commit Shadow Mode output
        run: |
          git config user.name "global-broker-bot"
          git config user.email "global-broker-bot@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --mixed origin/main
            git add data/latest-opportunities.json
            if git diff --cached --quiet; then
              echo "No new opportunity data to publish"
              break
            fi
            git commit -m "chore: update live shadow opportunities"
            if git push origin HEAD:main; then
              echo "Validated opportunity data published"
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Unable to publish after four non-destructive retries" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Trigger Pages deployment with translated data
        run: |
          gh workflow run deploy-mobile.yml
        env:
          GH_TOKEN: ${{ github.token }}
