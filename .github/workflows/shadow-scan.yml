name: Global Broker Shadow Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/shadow-scan.yml'
      - '.github/workflows/shadow-scan-trigger.txt'

permissions:
  contents: write
  actions: write

jobs:
  shadow-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run brokerage regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Fetch, enrich, analyze specifications and verify live global opportunities
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: |
          mkdir -p data
          python src/broker.py > data/latest-opportunities.json
          python -m src.china_feed data/latest-opportunities.json
          python -m src.china_ggzy_feed data/latest-opportunities.json
          python -m src.enrichment data/latest-opportunities.json
          python -m src.specification data/latest-opportunities.json
          python -m src.verification data/latest-opportunities.json
      - name: Validate enriched live output
        run: python -m src.validate_live_output data/latest-opportunities.json
      - name: Commit Shadow Mode output
        run: |
          git config user.name "global-broker-bot"
          git config user.email "global-broker-bot@users.noreply.github.com"
          git add data/latest-opportunities.json
          git diff --cached --quiet || git commit -m "chore: update live shadow opportunities"
          git pull --rebase origin main
          git push

      - name: Trigger Pages deployment with translated data
        run: |
          gh workflow run deploy-mobile.yml
        env:
          GH_TOKEN: ${{ github.token }}
