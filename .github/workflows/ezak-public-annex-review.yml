              pix.save(str(out/f'page-{num:02d}.png'))
          print('High-resolution drawing pages rendered: 1,6,9,11,12; visual/technical approval false')
          pdf.close()
          PY
      - name: Upload priority drawings for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ezak-47078-priority-drawings
          path: ${{ runner.temp }}/ezak-47078/priority-drawings/*.png
          if-no-files-found: ignore
          retention-days: 1
      - name: Render remaining seven hash-pinned drawing pages
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import fitz
          root=Path(os.environ['RUNNER_TEMP'])/'ezak-47078'
          manifest=root/'manifest.json'
          expected='cab5b314b5d59fb7fad3618ec1d6398dcf8cf6f32fbce41c88a06642e09f767f'
          if not manifest.is_file(): raise SystemExit('Remaining drawings BLOCKED: manifest missing')
          rows=json.loads(manifest.read_text(encoding='utf-8')).get('records',[])
          matches=[r for r in rows if r.get('sha256')==expected and r.get('kind')=='pdf']
