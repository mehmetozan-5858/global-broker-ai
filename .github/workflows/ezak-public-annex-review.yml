name: E-ZAK public annex review (manual only)

# Deliberately no schedule or push trigger. The official source has not yet
# passed a real acquisition acceptance test; no production deployment.
on:
  workflow_dispatch:
  # One narrowly scoped evidence probe on the isolated review branch.
  push:
    branches:
      - fix/ezak-document-id-discovery-20261113
    paths:
      - '.github/workflows/ezak-public-annex-review.yml'

permissions:
  contents: read

concurrency:
  group: ezak-public-annex-review
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline safety regression
        run: |
          python -m unittest discover -s tests -p 'test_ezak_*.py'
      - name: Fetch official public annexes (review only)
        id: collect
        continue-on-error: true
        run: |
          python scripts/ezak_public_annex_sync.py --output "$RUNNER_TEMP/ezak-47078"
      - name: Produce redacted acquisition summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from collections import Counter
          path = Path(os.environ['RUNNER_TEMP']) / 'ezak-47078' / 'manifest.json'
          if not path.is_file():
              print('Official acquisition: BLOCKED (no manifest)')
          else:
              data = json.loads(path.read_text(encoding='utf-8'))
              rows = data.get('records', [])
              print(f"Official acquisition: {len(rows)} discovered links, {sum('error' in r for r in rows)} failed")
              failures = Counter(
                  f"HTTP {row['http_status']}" if 'http_status' in row
                  else row.get('failure_class', row['error'])
                  for row in rows if 'error' in row
              )
              successes = Counter(row.get('kind', 'unclassified') for row in rows if 'error' not in row)
              print('Redacted failure classes:', json.dumps(dict(sorted(failures.items())), sort_keys=True))
              print('Downloaded signature classes:', json.dumps(dict(sorted(successes.items())), sort_keys=True))
              # Compare only aggregate hash matches with the 29 Oct historical audit.
              # No filenames, source URLs, bytes or private document text in logs.
              reference_hashes = {
                  'prior_doc_1': '187becc6beef06222861b311e55ddf88ea9f34909860e812768ce758ee745a04',
                  'prior_doc_2': '7f7347e3e9876504e9012ec1c302f02758505a58b5bcf66d8d7c78f5eac46c45',
                  'prior_doc_3': 'dcefbca8da9d62fc704a3b95650981d782ba0518d47099a1e461d3e370710229',
                  'prior_docx_1': '80ace4abf15579d9b08654960e6048fa1636f725116b5af39f2b08de7a87ce6d',
                  'prior_docx_2': 'd25e7b2577783987970f338b5fd2f57473a17ef1170da29efd161287c1a794f0',
                  'prior_formula_xlsx': '41144156ef49a411de75c423f3e460732bc1bc111da326d76801cb798de20d45',
                  'prior_drawing_pdf': 'cab5b314b5d59fb7fad3618ec1d6398dcf8cf6f32fbce41c88a06642e09f767f',
                  'prior_spec_original': '7b1937a90a083cd594e3bdd82772eaa088ace4300d87676220c8d109fc7c142b',
                  'prior_spec_amended': 'ec1501d66872990cb18d0e27be2f492d8911b09d28665955ec28f757434a161e',
                  'prior_tender_pdf': '057d11623a3487273f4c7e49be8858f51f315ef4d163cb191e32bfe7cdfaca27',
              }
              received = [row.get('sha256') for row in rows if 'error' not in row]
              received_set = set(received)
              matched = sorted(name for name, digest in reference_hashes.items() if digest in received_set)
              print('Historical SHA-256 baseline match count:', len(matched), 'of', len(reference_hashes))
              print('Historical SHA-256 baseline match labels:', json.dumps(matched))
              print('Unique downloaded hash count:', len(received_set))
              print('Unmatched downloaded hash count:', len(received_set - set(reference_hashes.values())))
              from urllib.parse import urlparse, unquote
              import re
              def doc_id(row):
                  path = unquote(urlparse(row.get('source_url', '')).path)
                  match = re.match(r'^/document_([0-9]+)/', path, re.I)
                  return match.group(1) if match else None
              ok_ids = {doc_id(r) for r in rows if 'error' not in r and doc_id(r)}
              failed_ids = {doc_id(r) for r in rows if 'error' in r and doc_id(r)}
              print('Document-ID grouping:', json.dumps({
                  'successful_id_count': len(ok_ids),
                  'failed_id_count': len(failed_ids),
                  'shared_ids_success_and_failure': len(ok_ids & failed_ids),
                  'failed_ids_without_success': len(failed_ids - ok_ids),
                  'failed_non_document_id_links': sum(1 for r in rows if 'error' in r and not doc_id(r)),
                  'successful_non_document_id_links': sum(1 for r in rows if 'error' not in r and not doc_id(r)),
              }, sort_keys=True))
              # These counts are diagnostic only: no revision or completeness acceptance.
              print('Acceptance remains BLOCKED: source completeness, authoritative revision and lot review unverified.')
              print('Acceptance: BLOCKED pending full annex and amendment reconciliation')
          PY
      - name: Inspect previously hashed XLSX formula inventory (read-only)
        if: always()
        shell: bash
        run: |
          python -m pip install 'openpyxl==3.1.5' --disable-pip-version-check --quiet
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from scripts.review_ted_xlsx_formulas import EXPECTED_SHA256, inspect
          folder = Path(os.environ['RUNNER_TEMP']) / 'ezak-47078'
          manifest = folder / 'manifest.json'
          if not manifest.is_file():
              raise SystemExit('XLSX review BLOCKED: manifest missing')
          rows = json.loads(manifest.read_text(encoding='utf-8')).get('records', [])
          matches = [r for r in rows if r.get('sha256') == EXPECTED_SHA256 and 'error' not in r]
          if len(matches) != 1:
              raise SystemExit(f'XLSX review BLOCKED: expected one matching workbook, found {len(matches)}')
          original = folder / matches[0]['file']
          # The source sync saves Office packages as .bin; openpyxl needs .xlsx.
          temporary = folder / 'hash-verified-workbook.xlsx'
          shutil.copyfile(original, temporary)
          # Report only which archive-safety class was triggered; do not publish
          # ZIP filenames, raw formulas, or document content.
          from zipfile import ZipFile
          with ZipFile(temporary) as archive:
              members = [n.filename.lower() for n in archive.infolist()]
          print('XLSX archive safety categories:', json.dumps({
              'external_link_entries': sum(x.startswith('xl/externallinks/') for x in members),
              'binary_or_executable_entries': sum(x.endswith(('.bin', '.exe')) for x in members),
              'vba_member_entries': sum('vbaproject' in x for x in members),
              'unsafe_path_entries': sum(x.startswith('/') or chr(92) in x or '..' in x.split('/') for x in members),
              'entry_count': len(members)
          }, sort_keys=True))
          # Classify binary OOXML members by their structural placement only.
          # Never log member names, formulas, ZIP bytes or untrusted XML values.
          from collections import Counter
          def bin_class(name):
              name = name.lower()
              if name.startswith('xl/printersettings/'): return 'printer_settings'
              if name.startswith('xl/embeddings/'): return 'embedded_object'
              if name.startswith('xl/activex/'): return 'activex'
              if 'vbaproject' in name: return 'vba'
              if name.startswith('xl/'): return 'other_excel_binary'
              return 'other_binary'
          bins = [x for x in members if x.endswith('.bin')]
          print('XLSX binary placement categories:', json.dumps(dict(sorted(Counter(bin_class(x) for x in bins).items())), sort_keys=True))
          print('XLSX safety policy: no binary content executed, formula evaluation remains disabled')
          try:
              result = inspect(temporary, allow_printer_settings=True)
              print('Hash-verified XLSX inventory:', json.dumps(result, sort_keys=True))
              # Classification only: do not execute formulas or emit cell references.
              from openpyxl import load_workbook
              from collections import Counter
              from openpyxl.formula.tokenizer import Tokenizer
                  wb = load_workbook(temporary, read_only=True, data_only=False, keep_links=False)
              signatures = Counter()
              complexity = Counter()
              try:
                  for sheet in wb:
                      for row in sheet.iter_rows():
                          for cell in row:
                              if cell.data_type != 'f':
                                  continue
                              formula = str(cell.value or '')
                              try:
                                  tokens = Tokenizer(formula).items
                                  funcs = [t.value.split('(')[0].upper() for t in tokens if t.type == 'FUNC' and t.subtype == 'OPEN']
                                  signatures.update(funcs if funcs else ['ARITHMETIC_OR_REFERENCE'])
                                  complexity.update(['contains_function' if funcs else 'no_function'])
                              except (ValueError, IndexError):
                                  complexity.update(['parse_error'])
              finally:
                  wb.close()
              print('XLSX formula function categories:', json.dumps(dict(sorted(signatures.items())), sort_keys=True))
              print('XLSX formula parsing categories:', json.dumps(dict(sorted(complexity.items())), sort_keys=True))
              print('Formula values and cell addresses intentionally not logged')
              print('Formula calculation acceptance: BLOCKED; inventory is not evaluation')
          finally:
              temporary.unlink(missing_ok=True)
          PY
      - name: Enforce fail-closed review outcome
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.collect.outcome }}" != "success" ]; then
            echo "Official acquisition failed; review remains blocked"
            exit 1
          fi
          echo "Acquisition may have succeeded; manual completeness/revision review still required"
