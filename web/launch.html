<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061725">
<title>Global Broker açılıyor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#061725;color:#eef5f9;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:28px}.box{text-align:center;max-width:420px}.logo{width:122px;height:122px;border-radius:30px;margin:0 auto 28px;display:block;box-shadow:0 24px 60px #0008}.brand{font-size:28px;font-weight:950;letter-spacing:-.04em}.brand span{color:#f3923c}.sub{margin-top:8px;color:#93a9b8;font-size:14px}.pulse{width:42px;height:42px;border:4px solid #24465d;border-top-color:#f3923c;border-radius:50%;margin:30px auto 18px;animation:spin .9s linear infinite}.status{color:#d8e2e9;font-weight:700}.hint{margin-top:8px;color:#7992a4;font-size:12px}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <img class="logo" src="/icon.svg" alt="Global Broker">
  <div class="brand">GLOBAL <span>BROKER</span></div>
  <div class="sub">Yönetici Operasyon Merkezi</div>
  <div class="pulse"></div>
  <div class="status" id="status">Sistem hazırlanıyor…</div>
  <div class="hint">Ücretsiz sunucu uyanırken bu ekran kısa süre görünebilir.</div>
</div>
<script>
(function(){
  var status=document.getElementById('status'),tries=0;
  async function wake(){
    tries++;
    try{
      var r=await fetch('/healthz?ts='+Date.now(),{cache:'no-store'});
      if(r.ok){status.textContent='Hazır. Yönetici paneli açılıyor…';setTimeout(function(){location.replace('/app?boot=1')},180);return;}
    }catch(e){}
    status.textContent=tries<4?'Sistem hazırlanıyor…':'Sunucu uyandırılıyor…';
    setTimeout(wake,1200);
  }
  wake();
})();
</script>
</body>
</html>
