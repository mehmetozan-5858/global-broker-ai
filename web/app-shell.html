<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071827">
<title>Global Broker Yönetici Uygulaması</title>
<style>html,body{margin:0;width:100%;height:100%;background:#061725;overflow:hidden}#app{display:block;width:100%;height:100%;border:0;background:#061725}</style>
</head>
<body>
<iframe id="app" src="/web/app.html" title="Global Broker Yönetici Uygulaması"></iframe>
<script>
(function(){var frame=document.getElementById('app');frame.addEventListener('load',function(){var w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;var style=d.createElement('style');style.textContent='.brand{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;font-weight:900!important;letter-spacing:-.03em!important}.brand span{color:#f3923c!important}.top{box-shadow:0 5px 22px rgba(0,0,0,.16)}.footerbar span{min-width:58px;padding:5px 7px;border-radius:10px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.footerbar .on{background:rgba(88,161,255,.12)}';d.head.appendChild(style);var bar=d.querySelector('.footerbar');if(bar){var tabs=[].slice.call(bar.querySelectorAll('span'));var keys=['home','markets','opps','report','settings'];tabs.forEach(function(t,i){t.setAttribute('role','button');t.setAttribute('tabindex','0');t.dataset.key=keys[i]||'';t.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();t.click();}})});function active(k){tabs.forEach(function(t){var on=t.dataset.key===k;t.classList.toggle('on',on);t.setAttribute('aria-current',on?'page':'false')})}var gh=w.goHome;if(typeof gh==='function')w.goHome=function(){gh();active('home');w.scrollTo(0,0)};var ot=w.openTab;if(typeof ot==='function')w.openTab=function(k){ot(k);active(k);w.scrollTo(0,0)};active('home')}var live=d.createElement('script');live.src='/web/operational-panels.js';d.body.appendChild(live);var readiness=d.createElement('script');readiness.src='/web/opportunity-readiness.js';d.body.appendChild(readiness);})})();
</script>
</body>
</html>
