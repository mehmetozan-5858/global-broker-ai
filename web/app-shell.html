<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071827">
<meta name="robots" content="noindex,nofollow">
<title>Global Broker Yönetici Uygulaması</title>
<style>html,body{margin:0;width:100%;height:100%;background:#061725;color:#e8f0f6;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}#app{display:none;width:100%;height:100%;border:0;background:#061725}.gate{height:100%;display:grid;place-items:center;padding:24px}.gatebox{width:min(520px,100%);background:#0d2739;border:1px solid #24465d;border-radius:20px;padding:26px;box-shadow:0 20px 60px #0005}.brand{font-size:24px;font-weight:900}.brand span{color:#f3923c}.gate h1{font-size:22px;margin:20px 0 8px}.gate p{color:#aebfca;line-height:1.55}.gate a{display:inline-block;margin-top:12px;background:#f3923c;color:#071827;padding:11px 14px;border-radius:10px;text-decoration:none;font-weight:900}.bad{color:#ffb2b9!important}</style>
</head>
<body>
<div id="gate" class="gate"><div class="gatebox"><div class="brand">GLOBAL <span>BROKER</span></div><h1>Yönetici doğrulaması</h1><p id="gateStatus">Supabase oturumu ve AAL2/MFA seviyesi doğrulanıyor…</p><a id="accountLink" href="/security">Güvenlik Merkezi / MFA</a></div></div>
<iframe id="app" title="Global Broker Yönetici Uygulaması"></iframe>
<script>
(function(){
  var SB_URL='https://yhzdqrqzjruduohypvqf.supabase.co',SB_KEY='sb_publishable_fFtN0JmDBp8TP01lKJhTFQ_sx6mkt-w';
  var frame=document.getElementById('app'),gate=document.getElementById('gate'),status=document.getElementById('gateStatus');
  function deny(text){status.textContent=text;status.classList.add('bad');frame.style.display='none';gate.style.display='grid';}
  function decode(token){try{var p=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');while(p.length%4)p+='=';return JSON.parse(decodeURIComponent(escape(atob(p))));}catch(e){return {};}}
  async function api(path,token){var r=await fetch(SB_URL+path,{headers:{apikey:SB_KEY,Authorization:'Bearer '+token}});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
  async function authorize(){
    var token=localStorage.getItem('gb_access_token')||'';
    if(!token){deny('Yönetici uygulaması için önce hesabınıza giriş yapın.');return;}
    try{
      var user=await api('/auth/v1/user',token),claims=decode(token);
      if(claims.aal!=='aal2'){deny('Yönetici erişimi AAL2/MFA doğrulaması gerektiriyor. Güvenlik Merkezi’nden ikinci faktörü tamamlayın.');return;}
      var roles=await api('/rest/v1/user_roles?select=role&user_id=eq.'+encodeURIComponent(user.id),token);
      if(!Array.isArray(roles)||!roles.some(function(x){return x&&x.role==='admin';})){deny('Bu oturum yönetici yetkisine sahip değil.');return;}
      gate.style.display='none';frame.style.display='block';frame.src='/web/app.html';
    }catch(e){deny('Yönetici oturumu doğrulanamadı. Lütfen yeniden giriş yapın.');}
  }
  frame.addEventListener('load',function(){var w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;var style=d.createElement('style');style.textContent='.brand{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;font-weight:900!important;letter-spacing:-.03em!important}.brand span{color:#f3923c!important}.top{box-shadow:0 5px 22px rgba(0,0,0,.16)}.footerbar span{min-width:58px;padding:5px 7px;border-radius:10px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.footerbar .on{background:rgba(88,161,255,.12)}';d.head.appendChild(style);var bar=d.querySelector('.footerbar');if(bar){var tabs=[].slice.call(bar.querySelectorAll('span'));var keys=['home','markets','opps','report','settings'];tabs.forEach(function(t,i){t.setAttribute('role','button');t.setAttribute('tabindex','0');t.dataset.key=keys[i]||'';t.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();t.click();}})});function active(k){tabs.forEach(function(t){var on=t.dataset.key===k;t.classList.toggle('on',on);t.setAttribute('aria-current',on?'page':'false')})}var gh=w.goHome;if(typeof gh==='function')w.goHome=function(){gh();active('home');w.scrollTo(0,0)};var ot=w.openTab;if(typeof ot==='function')w.openTab=function(k){ot(k);active(k);w.scrollTo(0,0)};active('home')}['/web/operational-panels.js','/web/opportunity-readiness.js','/web/opportunity-dossier.js','/web/ceo-priority.js','/web/today-tasks.js','/web/task-center.js','/web/system-health.js'].forEach(function(src){var s=d.createElement('script');s.src=src;d.body.appendChild(s);});});
  authorize();
})();
</script>
</body>
</html>
